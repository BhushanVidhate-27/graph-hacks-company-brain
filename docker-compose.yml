services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: helio-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_SSL=false
      - FALKORDB_GRAPH=helio
      - USE_MOCK=0
      # Commercial state lives on the bind-mounted repo, so accounts survive a
      # container restart. deploy/docker-compose.yml uses a named volume.
      - HELIO_DB_PATH=/app/data/helio.db
      - HELIO_REQUIRE_AUTH=${HELIO_REQUIRE_AUTH:-0}
      - ANON_DAILY_LIMIT=${ANON_DAILY_LIMIT:-100}
      - HELIO_TRUST_PROXY=${HELIO_TRUST_PROXY:-0}
      - HELIO_APP_URL=${HELIO_APP_URL:-http://localhost:8080}
      - HELIO_ALLOW_LOCAL_BILLING=${HELIO_ALLOW_LOCAL_BILLING:-0}
      - STRIPE_MODE=${STRIPE_MODE:-local}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER}
      - STRIPE_PRICE_PROFESSIONAL=${STRIPE_PRICE_PROFESSIONAL}
      # Legacy names kept so an older .env still works.
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO}
      - STRIPE_PRICE_FREE=${STRIPE_PRICE_FREE}
      - NEXT_PUBLIC_HELIO_PRICE_ID=${NEXT_PUBLIC_HELIO_PRICE_ID}
    volumes:
      - .:/app
    working_dir: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  falkordb:
    image: falkordb/falkordb:latest
    container_name: helio-falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "GRAPH.QUERY", "g", "RETURN 1 AS ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: front
      dockerfile: Dockerfile
    container_name: helio-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_HELIO_API=${NEXT_PUBLIC_HELIO_API:-http://localhost:8080}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      backend:
        condition: service_healthy