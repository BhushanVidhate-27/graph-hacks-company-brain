    <!-- Google Fonts: Space Mono & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#ecece4] text-[#282828] selection:bg-[#e15c46] selection:text-white overflow-x-hidden">
    <!-- SVG displacement filter used for technical blueprint / graph canvas noise textures -->
    <svg width="0" height="0" style="position: absolute;">
      <defs>
        <filter id="sharedDisplacementFilter">
          <feTurbulence type="fractalNoise" baseFrequency="0.045 0.055" numOctaves="4" seed="5" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
          <feGaussianBlur stdDeviation="0.4" result="blurred"/>
        </filter>
        <filter id="path-filter">
          <feFlood flood-opacity="0" result="BackgroundImageFix"/>
          <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
          <feTurbulence type="fractalNoise" baseFrequency="4 4" numOctaves="3" seed="5387"/>
          <feDisplacementMap in="shape" scale="2" xChannelSelector="R" yChannelSelector="G" result="displacedImage" width="100%" height="100%"/>
          <feMerge>
            <feMergeNode in="displacedImage"/>
          </feMerge>
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <noscript>
      <div style="max-width: 640px; margin: 80px auto; padding: 0 24px; font-family: 'Space Mono', monospace; color: #282828;">
        <h1 style="font-size: 40px; line-height: 1.05;">Know who owns it. Know what breaks. Know who to page.</h1>
        <p style="font-size: 15px; line-height: 1.7; color: #5c5c56;">
          Helio connects your repos, on-call schedules and decision records into one graph.
          Every answer about ownership, blast radius and history comes with the path that proves it —
          and when the graph has no answer, Helio says so instead of guessing.
        </p>
        <p style="font-size: 15px;">
          <a href="mailto:contact.helio.brain@gmail.com?subject=Helio%20walkthrough" style="color: #e15c46;">Book a walkthrough</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
