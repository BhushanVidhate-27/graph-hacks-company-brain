<!doctype html>
<html lang="en">
  <head>
    <!--seo-head-start-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helio: Service Ownership &amp; Blast Radius Knowledge Graph</title>
    <meta
      name="description"
      content="Helio connects repos, on-call schedules and decision records into one graph, so every answer about ownership, blast radius and history shows the path behind it."
    />
    <link rel="canonical" href="https://helio-brain.onrender.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#ecece4" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/space-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-mono-700.woff2" as="font" type="font/woff2" crossorigin />
    <!--seo-head-end-->
    <!-- SVG displacement filter used for technical blueprint / graph canvas noise textures -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter id="sharedDisplacementFilter">
          <feTurbulence type="fractalNoise" baseFrequency="0.045 0.055" numOctaves="4" seed="5" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
          <feGaussianBlur stdDeviation="0.4" result="blurred" />
        </filter>
        <filter id="path-filter">
          <feFlood flood-opacity="0" result="BackgroundImageFix" />
          <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
          <feTurbulence type="fractalNoise" baseFrequency="4 4" numOctaves="3" seed="5387" />
          <feDisplacementMap in="shape" scale="2" xChannelSelector="R" yChannelSelector="G" result="displacedImage" width="100%" height="100%" />
          <feMerge>
            <feMergeNode in="displacedImage" />
          </feMerge>
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <noscript>
      <div style="max-width: 640px; margin: 40px auto; padding: 0 24px; font-family: 'Space Mono', monospace; color: #282828;">
        <p style="font-size: 24px; line-height: 1.15; font-weight: 700;">Know who owns it. Know what breaks. Know who to page.</p>
        <p style="font-size: 14px; line-height: 1.7; color: #5c5c56;">
          Helio connects your repositories, on-call schedules and decision records into one graph.
          Every answer about ownership, blast radius and history comes with the path that proves it.
          The site works without JavaScript; the interactive agent needs it.
        </p>
        <p style="font-size: 14px;">
          <a href="/agent" style="color: #e15c46;">Open the demo</a> ·
          <a href="/auth" style="color: #e15c46;">Create an account</a> ·
          <a href="/pricing" style="color: #e15c46;">See pricing</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
