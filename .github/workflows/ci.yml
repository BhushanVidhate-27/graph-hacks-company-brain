name: Helio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt --no-cache-dir --upgrade pip
      - name: Lint & type check
        run: |
          python3 -m py_compile app/github.py app/main.py app/billing.py
      - name: Run pytest suite
        run: |
          python3 -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          cd front
          pnpm install --frozen-lockfile
      - name: Type check & build
        run: |
          cd front
          npx tsc --noEmit
          pnpm run build

  docker:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-compose.yml
          tags: your-dockerhub-username/helio-backend:latest
          push: false
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: front
          tags: your-dockerhub-username/helio-frontend:latest
          push: false